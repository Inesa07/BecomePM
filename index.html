<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Become PM — кейс FitStart</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,500&family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: calm, elegant, a little cinematic — a night shift at a startup.
   IDEA: a real product workspace, lit like a late-evening office with windows across the street.
   PICTURE: the workspace itself; on the home screen, a lit window grid behind an app preview.
   COLOUR and TYPE: night teal-black, amber light, teal accent, paper cards; Playfair Display + Manrope.
   LAYOUT: sources left, work center, insights right; stacks into one column on phones. */
:root{color-scheme:dark;--bg:#0D1416;--bg2:#0F181A;--panel:#121C1F;--panel2:#162225;--line:#233236;--line2:#2C3D41;--ink:#EEF0EC;--soft:#B5C0C1;--mute:#9AA8A9;--amber:#F2B56B;--teal:#5FB3A8;--rose:#E39A8C;--paper:#EFE6D6;--bar:#2B4145}
:root[data-theme=light],:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 Manrope,system-ui,sans-serif;overflow-x:clip}
.serif{font-family:'Playfair Display',Georgia,serif}
.it{font-style:italic}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.btn{border:0;background:var(--amber);color:#0D1416;padding:13px 24px;border-radius:999px;font-weight:700;min-height:44px}
.btn:hover{background:#FFC57F}
.btn:disabled{opacity:.45;cursor:not-allowed}
.ghost{border:1px solid var(--amber);background:transparent;color:var(--amber);padding:10px 18px;border-radius:999px;font-weight:600;min-height:44px}
.ghost:hover{background:rgba(242,181,107,.08)}
.done{border:1px solid var(--teal);background:var(--teal);color:#0D1416;padding:10px 18px;border-radius:999px;font-weight:700;min-height:44px}
.line-btn{border:1px solid var(--line2);background:transparent;padding:9px 15px;border-radius:999px;min-height:42px;text-align:left}
.line-btn:hover{border-color:var(--mute)}
.label{font-size:11px;font-weight:600;letter-spacing:.14em;color:var(--mute);text-transform:uppercase}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px}
.wrap{max-width:1180px;margin:0 auto;padding:28px clamp(16px,3vw,28px) 64px}
.top{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:18px}
.logo{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0}
.logo b{width:30px;height:30px;border-radius:8px;background:var(--amber);color:#0D1416;display:grid;place-items:center;font-family:'Playfair Display',serif;font-size:15px}
.logo span{font-family:'Playfair Display',serif;font-size:20px;font-weight:600}
/* home */
.hero{display:flex;flex-wrap:wrap;gap:56px;align-items:center;padding:56px 0}
.hero h1{margin:0;font-family:'Playfair Display',serif;font-weight:500;font-size:clamp(42px,6vw,64px);line-height:1.05;text-wrap:balance}
.hero p{font-size:17px;font-weight:300;line-height:1.7;color:var(--soft);max-width:480px;margin:0}
.city{position:absolute;right:0;top:0;width:min(330px,70%);height:100%;background:#121C1F;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;padding:30px 22px;align-content:start}
.city i{height:28px;background:#1A272A}
.city i.l{background:var(--amber);animation:flick 6s infinite}
.city i.t{background:var(--teal);opacity:.45}
@keyframes flick{0%,100%{opacity:.85}50%{opacity:.55}}
@media (prefers-reduced-motion:reduce){.city i.l,.toast,.ins.new,.step{animation:none!important}}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid var(--line)}
.steps div{padding:28px 28px 0 0}
.steps div+div{border-left:1px solid var(--line);padding-left:28px}
@media(max-width:760px){.steps{grid-template-columns:minmax(0,1fr)}.steps div+div{border-left:0;padding-left:0;border-top:1px solid var(--line)}.steps div{padding-bottom:20px}}
/* workspace */
.ws{display:grid;grid-template-columns:232px minmax(0,1fr) 290px;min-height:100vh}
.side{background:var(--bg2);border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:4px}
.src{display:flex;align-items:center;gap:11px;width:100%;min-height:42px;padding:8px 10px;border-radius:8px;background:transparent;border:1px solid transparent;text-align:left}
.src:hover{background:#152023}
.src.on{background:#1A272A;border-color:var(--line2);font-weight:600}
.dot{width:7px;height:7px;border-radius:50%;flex:none}
.src small{margin-left:auto;font-size:12px;color:var(--mute);white-space:nowrap}
.main{padding:18px clamp(16px,2.4vw,28px) 28px;display:flex;flex-direction:column;gap:16px}
.aside{background:var(--bg2);border-left:1px solid var(--line);padding:22px 18px;display:flex;flex-direction:column;gap:12px}
.bar{height:3px;background:var(--line);border-radius:2px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--amber);border-radius:2px;transition:width .5s}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.kpi{padding:13px 16px}
.kpi span{font-size:12px;color:var(--mute)}
.kpi b{display:block;font-family:'Playfair Display',serif;font-weight:500;font-size:26px}
.chart{display:flex;align-items:flex-end;gap:12px;height:180px;border-bottom:1px solid var(--line2);padding:0 4px}
.chart div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:7px;height:100%}
.chart em{font-style:normal;font-size:12px;color:var(--mute);white-space:nowrap}
.chart u{display:block;width:100%;background:var(--bar);border-radius:6px 6px 0 0;text-decoration:none}
.chart .hot u{background:var(--amber);box-shadow:0 0 22px rgba(242,181,107,.3)}
.chart .hot em{color:#0D1416;background:var(--amber);border-radius:5px;padding:1px 6px;font-weight:700}
.axis{display:flex;gap:12px;padding:0 4px;font-size:12px;color:var(--mute)}
.axis span{flex:1;text-align:center}
.find{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
.find .serif{font-size:17px}
.bubble-q{align-self:flex-end;max-width:78%;background:#233236;border-radius:16px 16px 4px 16px;padding:11px 16px}
.bubble-a{align-self:flex-start;max-width:78%;border:1px solid var(--line2);border-radius:16px 16px 16px 4px;padding:11px 16px;line-height:1.6}
.bubble-a.good{border-color:var(--teal)}
.tip{font-family:'Playfair Display',serif;font-style:italic;font-size:14px;color:var(--amber)}
.person{display:flex;align-items:center;gap:12px}
.people{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.pcard{padding:16px;display:flex;flex-direction:column;gap:10px;text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:12px}
.pcard:hover{border-color:var(--line2)}
.pcard.on{border-color:var(--amber)}
.srcgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr));gap:12px}
.row{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:14px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.row:last-child{border-bottom:0}
.msg{display:flex;gap:14px;align-items:flex-start}
.quote{font-family:'Playfair Display',serif;font-style:italic;font-size:18px;line-height:1.55}
.ins{background:var(--paper);color:#1E1B16;border-radius:4px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;box-shadow:0 10px 22px rgba(0,0,0,.35)}
.ins.new{animation:glow 2.2s ease-out}
@keyframes glow{0%{box-shadow:0 0 0 2px var(--amber),0 0 34px rgba(242,181,107,.7);transform:rotate(-1.5deg)}100%{box-shadow:0 10px 22px rgba(0,0,0,.35);transform:none}}
.tag{align-self:flex-start;font-size:11px;font-weight:700;border-radius:5px;padding:2px 7px}
.ins .serif{font-style:italic;font-size:15px;line-height:1.45}
.hyp{display:flex;flex-direction:column;gap:6px;padding:4px 0}
.hyp small{font-size:12px;color:var(--mute)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:9;display:flex;align-items:center;gap:12px;border:1px solid var(--amber);background:#1C2422;border-radius:12px;padding:12px 18px;box-shadow:0 0 30px rgba(242,181,107,.25),0 20px 40px rgba(0,0,0,.5);animation:up .35s ease-out;max-width:calc(100% - 32px)}
@keyframes up{from{opacity:0;transform:translate(-50%,12px)}to{opacity:1;transform:translate(-50%,0)}}
.nudge{display:flex;gap:12px;align-items:center;border:1px solid var(--line2);background:var(--panel2);border-radius:12px;padding:10px 14px}
.lead{margin:0;font-size:17px;font-weight:300;line-height:1.75;color:var(--soft);max-width:680px}
.lead b{color:var(--ink);font-weight:600}
.how{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.how .card{padding:20px;display:flex;flex-direction:column;gap:8px}
.how .card span:last-child{font-size:14px;color:var(--soft);line-height:1.6}
.teamgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:12px}
.step{animation:fadeIn .4s ease-out}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media(max-width:760px){.how{grid-template-columns:minmax(0,1fr)}}
.modal-bg{position:fixed;inset:0;z-index:20;background:rgba(5,9,10,.72);display:grid;place-items:center;padding:16px;animation:fadeIn .25s ease-out}
.modal{position:relative;width:min(420px,100%);padding:28px;display:flex;flex-direction:column;gap:16px;background:var(--panel);border-color:var(--line2);box-shadow:0 40px 80px rgba(0,0,0,.6)}
input:focus{outline:2px solid var(--amber);outline-offset:1px}
.back{align-self:flex-start;background:none;border:0;color:var(--soft);font-size:14px;padding:14px 0 0;min-height:44px}
.back:hover{color:var(--amber)}
/* decision */
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;padding:14px 16px;border-radius:12px;border:1px solid var(--line);background:var(--panel)}
.opt:hover{border-color:var(--line2)}
.opt.on{border-color:var(--amber);background:#1A2422}
.opt i{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--mute);flex:none;margin-top:3px}
.opt.on i{border-color:var(--amber);background:radial-gradient(var(--amber) 45%,transparent 50%)}
.opt.sq i{border-radius:4px}
.opt.sq.on i{background:var(--amber)}
/* result */
.grade{width:118px;height:118px;border-radius:50%;border:1px solid var(--amber);display:grid;place-items:center;font-family:'Playfair Display',serif;font-size:56px;color:var(--amber);box-shadow:0 0 50px rgba(242,181,107,.3);flex:none}
.conf{position:absolute;width:9px;height:4px;border-radius:1px}
.check{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
@media(max-width:1060px){
 .ws{grid-template-columns:minmax(0,1fr)}
 .side{border-right:0;border-bottom:1px solid var(--line);flex-direction:row;flex-wrap:nowrap;overflow-x:auto;padding:12px;gap:8px;align-items:center}
 .side .hide-m{display:none}
 .src{width:auto;flex:none;border-color:var(--line)}
 .aside{border-left:0;border-top:1px solid var(--line)}
}
@media(max-width:640px){
 .kpis{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
 .kpis .kpi:last-child{grid-column:1/-1}
 .people{grid-template-columns:minmax(0,1fr)}
 .chart{gap:6px;height:150px}.axis{gap:6px}
 .chart em{font-size:10px}
 .bubble-q,.bubble-a{max-width:92%}
}
</style>
</head>
<body>
<div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
{
/* ---------- avatars ---------- */
const HAIR = {
  long: [c => `<path d="M11 24c0-9 5-14 11-14s11 5 11 14v8h-4v-9H15v9h-4z" fill="${c}"/>`, c => `<path d="M14 19c2-6 14-7 16 0-4-2-11-3-16 0z" fill="${c}"/>`],
  short: [() => '', c => `<path d="M14 19c0-6 4-8 8-8s8 2 8 8c-3-3-13-3-16 0z" fill="${c}"/>`],
  curly: [() => '', c => `<circle cx="16" cy="15" r="3.5" fill="${c}"/><circle cx="20" cy="12.5" r="3.5" fill="${c}"/><circle cx="24.5" cy="12.5" r="3.5" fill="${c}"/><circle cx="28" cy="15.5" r="3.5" fill="${c}"/>`],
  bun: [c => `<circle cx="22" cy="10.5" r="4.2" fill="${c}"/>`, c => `<path d="M14 20c0-6 4-8.5 8-8.5s8 2.5 8 8.5c-3-4-13-4-16 0z" fill="${c}"/>`],
  bob: [c => `<path d="M13 23c0-8 4-12 9-12s9 4 9 12v5h-3v-7H16v7h-3z" fill="${c}"/>`, c => `<path d="M14 19c2-5 14-6 16 0-5-2-11-2-16 0z" fill="${c}"/>`]
};
const PEOPLE = {
  me:    { bg:'#F6E2C2', shirt:'#F2B56B', skin:'#F1C7A6', hair:'#3B2A22', style:'long' },
  anna:  { bg:'#D3ECE8', shirt:'#5FB3A8', skin:'#F1C7A6', hair:'#8A4B2F', style:'long', name:'Анна' },
  sveta: { bg:'#EDE4D0', shirt:'#B89B6A', skin:'#F3D2B5', hair:'#C9A15A', style:'bob', name:'Света' },
  mark:  { bg:'#D9E4DC', shirt:'#4F7A62', skin:'#C99372', hair:'#1E1B16', style:'short', name:'Марк' },
  max:   { bg:'#E7DFF3', shirt:'#7C67A8', skin:'#E9B894', hair:'#2D2A32', style:'short', glasses:true, name:'Максим' },
  lesha: { bg:'#DCE9F4', shirt:'#6E9CC2', skin:'#F0C9A6', hair:'#6B4A32', style:'curly', name:'Лёша' },
  mentor:{ bg:'#DCEDE6', shirt:'#2F5D55', skin:'#EBC3A2', hair:'#9A9A9A', style:'bun', name:'Вера' },
  dina:  { bg:'#F6E2C2', shirt:'#C99A4E', skin:'#A97A5C', hair:'#1E1B16', style:'bob', name:'Дина' },
  ira:   { bg:'#F4DAD4', shirt:'#D07D6E', skin:'#C99372', hair:'#2D2A32', style:'bun', name:'Ира' }
};
function av(id, size = 40, mood = 'neutral') {
  const p = PEOPLE[id], h = HAIR[p.style];
  const eyes = mood === 'happy'
    ? '<path d="M17.8 22q1.2-1.4 2.4 0M23.8 22q1.2-1.4 2.4 0" stroke="#1E1B16" stroke-width="1" fill="none" stroke-linecap="round"/>'
    : '<circle cx="19" cy="22" r="1" fill="#1E1B16"/><circle cx="25" cy="22" r="1" fill="#1E1B16"/>';
  const mouth = { neutral:'M19 25.5q3 2.5 6 0', sad:'M19.5 26.5q2.5-1.5 5 0', happy:'M18.5 25q3.5 3.5 7 0' }[mood];
  const glasses = p.glasses ? '<circle cx="19" cy="22" r="2.4" fill="none" stroke="#2D2A32" stroke-width=".9"/><circle cx="25" cy="22" r="2.4" fill="none" stroke="#2D2A32" stroke-width=".9"/><path d="M21.4 22h1.2" stroke="#2D2A32" stroke-width=".9"/>' : '';
  return `<svg width="${size}" height="${size}" viewBox="0 0 44 44" role="img" aria-label="${p.name || 'Ты'}" style="flex:none"><circle cx="22" cy="22" r="22" fill="${p.bg}"/><path d="M8 44c2-9 8-13 14-13s12 4 14 13z" fill="${p.shirt}"/>${h[0](p.hair)}<circle cx="22" cy="21" r="8" fill="${p.skin}"/>${h[1](p.hair)}${eyes}${glasses}<path d="${mouth}" stroke="#1E1B16" stroke-width="1.05" fill="none" stroke-linecap="round"/></svg>`;
}
const SPARK = '<svg width="20" height="20" viewBox="0 0 24 24" fill="#F2B56B" aria-hidden="true"><path d="M12 2l1.8 6.2L20 10l-6.2 1.8L12 18l-1.8-6.2L4 10l6.2-1.8z"/><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"/></svg>';

/* ---------- case content ---------- */
const MAX_DAY = 20;
const SOURCES = [
  { id:'overview', label:'Обзор', cost:0, color:'#EEF0EC', tag:['#E5E5E5','#333'], title:'Твой рабочий стол', sub:'' },
  { id:'analytics', label:'Аналитика', cost:1, color:'#F2B56B', tag:['#F6E2C2','#6B4614'], title:'Удержание новых пользователей', sub:'Удержание (retention) — доля новичков, которые продолжают открывать приложение.' },
  { id:'users', label:'Интервью', cost:0, color:'#5FB3A8', tag:['#D3ECE8','#1E5A52'], title:'Интервью с пользователями', sub:'Каждый разговор занимает 1 день. От того, как ты спрашиваешь, зависит, что ты узнаешь.' },
  { id:'support', label:'Поддержка', cost:1, color:'#E39A8C', tag:['#F4DAD4','#7A3426'], title:'Обращения в поддержку', sub:'Что пользователи писали за последний месяц. Самое громкое — не всегда самое важное.' },
  { id:'team', label:'Команда', cost:1, color:'#9FC7E6', tag:['#DCE9F4','#264B6B'], title:'Рабочий чат команды', sub:'Разработчики и аналитик знают то, чего нет в отчётах.' },
  { id:'ceo', label:'CEO', cost:0, color:'#C9B6E4', tag:['#E7DFF3','#4A3470'], title:'Сообщение от CEO', sub:'Мнение руководителя важно учесть, но это ещё не факт.' }
];
const BLURB = { analytics:['Цифры: что происходит и когда', '1 день'], users:['Разговоры с людьми: почему они уходят', '1 день за разговор'], support:['Жалобы и просьбы пользователей', '1 день'], team:['Что недавно менялось в продукте', '1 день'], ceo:['Мнение руководителя', 'бесплатно'] };
const SRC = Object.fromEntries(SOURCES.map(s => [s.id, s]));
const HYPS = [
  { id:'hard', title:'Сложный старт для новичков' },
  { id:'social', title:'Не хватает соцфункций' },
  { id:'dark', title:'Нужна тёмная тема' }
];
// insight: text, source, hypothesis, sign (+ supports / - contradicts), key = important for the real cause
const INS = {
  drop:     { text:'Обрыв удержания между 3-м и 4-м днём', src:'analytics', hyp:'hard', s:1, key:true },
  sept:     { text:'Падение началось в сентябре — раньше удержание было 38%', src:'analytics', hyp:'hard', s:1, key:true },
  anna:     { text:'Анна: «На 10-й минуте поняла, что не вытяну. Стало стыдно»', src:'users', hyp:'hard', s:1, key:true },
  sveta:    { text:'Света: «35 минут прыжков. Выключила на середине»', src:'users', hyp:'hard', s:1, key:true },
  svetaF:   { text:'Света: «С подругой было бы классно»', src:'users', hyp:'social', s:1 },
  markDark: { text:'Марк: «Хочу тёмную тему, вечером режет глаза»', src:'users', hyp:'dark', s:1 },
  markSolo: { text:'Марк тренируется один уже 8 месяцев — ему так удобнее', src:'users', hyp:'social', s:-1 },
  dark:     { text:'14 просьб о тёмной теме — от активных пользователей', src:'support', hyp:'dark', s:1 },
  hardSup:  { text:'9 жалоб новичков: первая тренировка слишком тяжёлая', src:'support', hyp:'hard', s:1, key:true },
  team35:   { text:'В сентябре первую тренировку удлинили с 15 до 35 минут', src:'team', hyp:'hard', s:1, key:true },
  dina:     { text:'Кто закончил первую тренировку — остаётся в 2 раза чаще', src:'team', hyp:'hard', s:1, key:true },
  ceo:      { text:'CEO уверен: людям скучно тренироваться одним', src:'ceo', hyp:'social', s:1 }
};
const INTERVIEWS = {
  anna: { who:'Анна, 29 лет', note:'ушла на 4-й день', mood:'sad', qs:[
    { q:'Вам нравилось наше приложение?', a:'Да, нормальное. Красивое.', tip:'Вопрос о мнении — вежливый ответ ничего не объясняет.' },
    { q:'Расскажите про последний раз, когда вы открывали приложение.', a:'Открыла первую тренировку… На 10-й минуте поняла, что не вытяну. Стало стыдно, и больше я не заходила.', ins:'anna' },
    { q:'Вы бы занимались больше, если бы там были друзья?', a:'Ну… наверное, да. Звучит весело.', tip:'Вопрос о будущем: люди легко говорят «да», но это не значит, что так и будет.' }

const RU_ERR = m => /Invalid login/i.test(m) ? 'Неверный email или пароль.'
  : /already registered|already exists/i.test(m) ? 'Такой email уже зарегистрирован. Попробуй войти.'
  : /at least 6|Password should/i.test(m) ? 'Пароль должен быть не короче 6 символов.'
  : /Email not confirmed/i.test(m) ? 'Сначала подтверди email — ссылка в письме.'
  : /valid email|invalid format/i.test(m) ? 'Проверь, правильно ли написан email.'

async function setUser(u) {
  user = u ? { id: u.id, email: u.email, name: (u.user_metadata && u.user_metadata.name) || u.email.split('@')[0] } : null;
  if (user) await syncProgress();
  render();
}
async function syncProgress() {
  if (!sb || !user) return;
  try {
    const { data } = await sb.from('becomepm_progress').select('xp,best_grade,cases').eq('user_id', user.id).maybeSingle();
    if (data) {
      S.xp = Math.max(S.xp, data.xp || 0);
      best = better(best, data.best_grade);
      try { localStorage.setItem('becomepm-best', best || ''); localStorage.setItem('becomepm-xp', S.xp); } catch (e) {}
    }
    await saveProgress();
  } catch (e) { console.warn('progress sync failed', e); }
}
async function saveProgress(caseResult) {
  if (!sb || !user) return;
  try {
    const row = { user_id: user.id, xp: S.xp, best_grade: best || null, updated_at: new Date().toISOString() };
    if (caseResult) {
      const { data } = await sb.from('becomepm_progress').select('cases').eq('user_id', user.id).maybeSingle();
      const cases = (data && data.cases) || {};
      const prev = cases.fitstart || {};
      cases.fitstart = { grade: better(prev.grade, caseResult.grade), bestScore: Math.max(prev.bestScore || 0, caseResult.score), plays: (prev.plays || 0) + 1, last: new Date().toISOString() };
      row.cases = cases;
    }
    const { error } = await sb.from('becomepm_progress').upsert(row);
    if (error) console.warn('save failed', error.message);
  } catch (e) { console.warn('save failed', e); }
}
async function authSubmit() {
  if (!sb) { S.auth = 'soon'; return render(); }
  const v = id => (document.getElementById(id) || {}).value || '';
  const email = v('a-mail').trim(), pass = v('a-pass'), name = v('a-name').trim();
  S.authName = name; S.authMail = email;
  if (!email || !pass) { S.authErr = 'Заполни email и пароль.'; return render(); }
  S.authBusy = true; S.authErr = ''; render();
  try {
    if (S.auth === 'signup') {
      const { data, error } = await sb.auth.signUp({ email, password: pass, options: { data: { name: name || email.split('@')[0] }, emailRedirectTo: location.origin + location.pathname } });
      if (error) throw error;
      if (data.session) { S.auth = 'welcome'; } else { S.auth = 'check'; }
    } else {
      const { error } = await sb.auth.signInWithPassword({ email, password: pass });
      if (error) throw error;
      S.auth = 'welcome';
    }
  } catch (e) { S.authErr = RU_ERR(e.message || String(e)); }
  S.authBusy = false; render();
}
async function logout() { if (sb) await sb.auth.signOut(); user = null; render(); }
if (sb) {
  sb.auth.getSession().then(({ data }) => setUser(data.session && data.session.user));

}

      <div style="flex:0 1 220px;display:flex;flex-direction:column;gap:8px"><div style="display:flex;align-items:flex-end;gap:8px;height:90px" role="img" aria-label="Удержание через 4 недели: ${R.end}%">${weeks.map((v, i) => `<i style="flex:1;height:${v / maxW * 100}%;background:${i === 4 ? (good ? 'var(--teal)' : 'var(--rose)') : 'var(--bar)'};border-radius:4px 4px 0 0"></i>`).join('')}</div><span class="serif" style="font-size:26px">26% → <span style="color:${good ? 'var(--teal)' : 'var(--rose)'}">${R.end}%</span></span></div>
    </section>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:16px;margin-top:18px">
      <div class="card msg" style="padding:20px">${av('anna', 48, good ? 'happy' : 'sad')}<div><div style="font-size:13px;color:var(--mute)">Анна · через месяц</div><div class="quote" style="font-size:17px">${annaLine}</div></div></div>
      <div class="card msg" style="padding:20px">${av('max', 48, good ? 'happy' : 'sad')}<div><div style="font-size:13px;color:var(--mute)">Максим · CEO</div><div class="quote" style="font-size:17px">${ceoLine}</div></div></div>
    </div>
    <div style="display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start;margin-top:18px">
      <section class="card" style="flex:999 1 460px;padding:24px;display:flex;flex-direction:column;gap:14px"><span class="serif" style="font-size:22px">Твой путь</span>${S.aiFeedback ? `<div class="person" style="align-items:flex-start;background:var(--panel2);border-radius:12px;padding:14px 16px">${av('mentor', 36, 'happy')}<span style="font-size:14px;color:var(--soft);line-height:1.6"><b style="color:var(--ink)">Вера о твоей защите:</b> ${esc(S.aiFeedback)}</span></div>` : ''}${path}
        ${badQs ? `<div style="font-size:14px;color:var(--soft)">Вопросов о мнении или будущем в интервью: <b style="color:var(--amber)">${badQs}</b>. Такие вопросы дают вежливые, но пустые ответы.</div>` : ''}
        <div style="font-size:14px;color:var(--soft)">Доказательств в решении: <b style="color:var(--amber)">${R.proofs}</b>${R.convinced ? '' : ' — CEO нужно хотя бы два, чтобы поверить.'} · Потрачено дней: <b style="color:var(--amber)">${S.day}</b> из ${MAX_DAY}</div>
        <div style="background:var(--panel2);border-radius:12px;padding:16px 18px;display:flex;flex-direction:column;gap:6px"><span class="label" style="color:var(--amber)">Что было на самом деле</span><p style="margin:0;font-weight:300;line-height:1.7;color:#D6DCDC">В сентябре маркетинг попросил сделать первую тренировку «настоящей» — 35 минут вместо 15. Новички не справлялись, им было стыдно, и они молча уходили на 3–4 день. Людям было не скучно — им было тяжело. Соцсеть и тёмная тема — реальные просьбы, но от тех, кто и так остаётся.</p></div>
      </section>
      <aside style="flex:1 1 280px;display:flex;flex-direction:column;gap:16px">
        <div class="card" style="padding:22px;display:flex;flex-direction:column;gap:12px;border-color:var(--amber);box-shadow:0 0 40px rgba(242,181,107,.12)"><div style="display:flex;justify-content:space-between;align-items:baseline"><span class="label">Опыт</span><b style="color:var(--amber)">+${R.score + S.ins.length * 10}</b></div><span class="serif" style="font-size:22px">Уровень ${lv.n} · <span class="it">${lv.name}</span></span><div class="bar" style="height:4px"><i style="width:${Math.min(100, (S.xp - lv.from) / (lv.to - lv.from) * 100)}%"></i></div><span style="font-size:13px;color:var(--soft)">Новые кейсы появятся в следующей версии.</span></div>
        <div class="ins" style="padding:20px;transform:rotate(-1deg)"><span style="font-size:11px;letter-spacing:.16em;color:#6B4614;font-weight:700">УРОК ПРОДАКТА</span><span class="serif" style="font-size:19px">Спрашивай о прошлом поведении, а не о мнениях и планах. И проверяй, что изменилось в продукте, когда начались проблемы.</span><span style="font-size:13px;color:#5C5547">Подробнее — в книге «The Mom Test», Роб Фитцпатрик</span></div>
        ${user ? `<div class="card" style="padding:18px 20px;display:flex;gap:12px;align-items:center;background:var(--panel2)"><span class="check" style="background:var(--teal);color:#0D1416">✓</span><span style="font-size:14px;color:var(--soft)">Прогресс сохранён в аккаунте <b style="color:var(--ink)">${esc(user.name)}</b></span></div>` : `<div class="card" style="padding:22px;display:flex;flex-direction:column;gap:12px;background:var(--panel2)"><span class="serif" style="font-size:20px">Сохрани свой прогресс</span><span style="font-size:14px;color:var(--soft);line-height:1.6">Создай аккаунт, чтобы не потерять уровень и результаты и играть с любого устройства.</span><button class="btn" data-auth="signup">Создать аккаунт</button><button class="line-btn" data-auth="login" style="text-align:center">У меня уже есть аккаунт</button></div>`}
        <button class="line-btn" data-go="hub" style="text-align:center">К кейсам</button><button class="line-btn" data-restart style="text-align:center">Пройти кейс заново</button>
      </aside>
    </div>
  </div>`;
}

/* ---------- render & events ---------- */
function render() {
  const views = { home, intro: brief, hub, brief, work, decide, result };
  app.innerHTML = views[S.view]() + authModal() + helpModal();
  const f = app.querySelector('.modal input'); if (f) f.focus();
  const t = app.querySelector('.toast');
  if (t) setTimeout(() => { t.style.transition = 'opacity .4s'; t.style.opacity = '0'; setTimeout(() => t.remove(), 400); }, 2600);
  document.title = { intro:'Как играть — Become PM', hub:'Кейсы — Become PM', home:'Become PM — кейс FitStart', brief:'Брифинг — Become PM', work:'Работа над кейсом — Become PM', decide:'Решение — Become PM', result:'Итог кейса — Become PM' }[S.view];
}
app.addEventListener('click', e => {
  if (e.target.matches('[data-auth-bg]')) { S.auth = null; return render(); }
  if (e.target.matches('[data-help-bg]')) { S.help = false; return render(); }
  const b = e.target.closest('button');
  if (!b) return;
  const d = b.dataset;
  if (d.help) { S.help = d.help === 'open'; return render(); }
  if (d.auth) { S.auth = d.auth === 'close' ? null : d.auth; S.authErr = ''; return render(); }
  if ('authsubmit' in d) return authSubmit();
  if ('logout' in d) return logout();
  if (d.go) {
    if (d.go === 'intro' || d.go === 'brief') S.step = 0;
    if (d.go === 'brief' && S.result) { const keep = S.xp; S = fresh(); S.xp = keep; }
    if (d.go === 'start') { let seen = null; try { seen = localStorage.getItem('becomepm-seen'); } catch (e) {} try { localStorage.setItem('becomepm-seen', '1'); } catch (e) {} S.step = 0; return go(seen ? 'hub' : 'intro'); }
    return go(d.go);
  }
  if (d.step) { S.step = Math.max(0, (S.step || 0) + +d.step); render(); window.scrollTo(0, 0); return; }
  if (d.hide) { S.hidden[d.hide] = true; return render(); }
  if (d.src) return openSource(d.src);
  if (d.talk) return talk(d.talk);
  if (d.ask) { const [p, i] = d.ask.split('|'); return ask(p, +i); }
  if (d.save) return save(d.save);
  if (d.att) { const a = S.d.att, k = d.att; const dr = document.getElementById('draft'); if (dr) S.d.draft = dr.value; const lim = S.d.mode === 'ai' ? 3 : 2; S.d.att = a.includes(k) ? a.filter(x => x !== k) : a.length < lim ? a.concat(k) : a; return render(); }
  if (d.scause) return scriptAnswer('cause', d.scause);
  if (d.sfix) return scriptAnswer('fix', d.sfix);
  if ('sev' in d) return scriptAnswer('ev');
  if ('send' in d) return aiSend();
  if ('finish' in d) return aiFinish();
  if ('submit' in d) { if (S.cause && S.fix) { evaluate(); go('result'); } return; }
  if ('restart' in d) { const keep = S.xp; S = fresh(); S.xp = keep; S.view = 'brief'; render(); window.scrollTo(0, 0); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && S.auth && document.activeElement && document.activeElement.closest('.modal') && document.activeElement.tagName === 'INPUT') { e.preventDefault(); authSubmit(); return; } if (e.key === 'Escape' && (S.auth || S.help)) { S.auth = null; S.help = false; render(); } });
render();
}
</script>
</body>
</html>
